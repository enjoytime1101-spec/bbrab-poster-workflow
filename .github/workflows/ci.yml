name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - run: node --check docs/app.js
      - run: python scripts/audit_public.py
      - name: Fresh environment, offline CLI
        run: |
          python -m venv "$RUNNER_TEMP/poster-clean"
          "$RUNNER_TEMP/poster-clean/bin/python" skill/bbrab-poster-workflow/scripts/poster_workflow.py examples/rocket-concept.json --output "$RUNNER_TEMP/poster-job.json"
